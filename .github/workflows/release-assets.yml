name: Build and publish release

on:
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    name: Build and upload plugin assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run validate:manifest

      - name: Build production bundle
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create GitHub release and upload plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json --verify-tag --generate-notes --title "Release $RELEASE_TAG"
